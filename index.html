<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141311" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Repertoire">
<title>Repertoire</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon-gold.png">
<link rel="icon" href="icon-192-gold.png" type="image/png">
<link rel="stylesheet" href="styles.css">

</head>
<body>
<div id="save-status" role="alert" aria-live="assertive" hidden></div>
<div id="app">
  <main id="screen-today" class="screen" data-screen="today"></main>
  <main id="screen-repertoire" class="screen" data-screen="repertoire" hidden></main>
</div>

<nav id="tabbar" aria-label="Sections">
  <button class="tab is-active" data-tab="today" aria-current="page">
    <span class="tab-label">Today</span>
  </button>
  <button class="tab" data-tab="repertoire">
    <span class="tab-label">Repertoire</span>
  </button>
  <span class="tab tab-empty" aria-hidden="true"></span>
  <span class="tab tab-empty" aria-hidden="true"></span>
</nav>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-backdrop" data-action="close-sheet"></div>
  <div class="sheet-panel" role="dialog" aria-modal="true"></div>
</div>

<input type="file" id="import-file" accept="application/json,.json" hidden>

<script src="app.js"></script>
<script src="ui.js"></script>

</body>
</html>
